name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  maven:
    name: Maven build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test
        run: mvn -B -ntp verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload boot jar
        uses: actions/upload-artifact@v4
        with:
          name: mcp-ai-client-jar
          path: target/*.jar
          retention-days: 7

  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: maven
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Build into the local daemon first so the image can be smoke-tested
      # before anything is published.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The app eagerly connects to the configured MCP server on startup and
      # aborts if it is unreachable, so initialization is deferred here. This
      # checks that the image boots and serves actuator, not MCP connectivity.
      - name: Smoke test the image
        run: |
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          echo "Smoke testing $IMAGE"
          docker run -d --name smoke -p 8080:8080 \
            -e OPENAI_API_KEY=dummy \
            -e SPRING_AI_MCP_CLIENT_INITIALIZED=false \
            "$IMAGE"
          up=false
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              up=true
              break
            fi
            sleep 2
          done
          if [ "$up" != true ]; then
            echo "container did not become healthy" >&2
            docker logs smoke >&2
            docker rm -f smoke >/dev/null
            exit 1
          fi
          echo "health endpoint is up"

          # Generating the OpenAPI spec is the only thing that exercises the
          # swagger-annotations version pin, and it fails at runtime rather than
          # at compile time, so assert it here.
          if ! curl -fsS http://localhost:8080/v3/api-docs | grep -q '"openapi"'; then
            echo "OpenAPI spec did not generate" >&2
            docker logs smoke >&2
            docker rm -f smoke >/dev/null
            exit 1
          fi
          echo "OpenAPI spec generated"

          curl -fsS http://localhost:8080/api/ping
          docker rm -f smoke >/dev/null

      # Pull requests stop here: the Dockerfile is proven to build and boot,
      # but only main and version tags publish to GHCR.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
