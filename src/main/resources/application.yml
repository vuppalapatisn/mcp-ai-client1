server:
  port: 8080

spring:
  application:
    name: mcp-ai-client
  ai:
    google:
      genai:
        # Setting an api-key (and no project-id) selects Gemini Developer API
        # mode. For Vertex AI instead, drop the key and set project-id/location.
        api-key: ${GEMINI_API_KEY:replace-me}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.6-flash}
    mcp:
      client:
        name: enterprise-ai-host
        version: 1.0.0
        type: ASYNC
        initialized: true
        request-timeout: 10s
        streamable-http:
          connections:
            order-server:
              url: https://mcp-order-server-1.onrender.com

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

app:
  # Endpoints under /api/conversations read and write conversation state without
  # calling the model. Set to false to leave them out of the application.
  testing-api:
    enabled: ${TESTING_API_ENABLED:true}
