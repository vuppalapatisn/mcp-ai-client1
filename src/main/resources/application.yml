server:
  # Platforms such as Render, Heroku and Cloud Run inject the port to bind as
  # PORT. Falls back to 8080 for local runs and the Dockerfile's EXPOSE.
  port: ${PORT:8080}

spring:
  application:
    name: mcp-ai-client
  ai:
    google:
      genai:
        # Setting an api-key (and no project-id) selects Gemini Developer API
        # mode. For Vertex AI instead, drop the key and set project-id/location.
        api-key: ${GEMINI_API_KEY:replace-me}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.6-flash}
    mcp:
      client:
        # Set MCP_CLIENT_ENABLED=false to drop the MCP client entirely. The chat
        # endpoint then answers with no tools instead of failing to start.
        enabled: ${MCP_CLIENT_ENABLED:true}
        name: enterprise-ai-host
        version: 1.0.0
        type: ASYNC
        # Connecting eagerly aborts startup when the MCP server is unreachable,
        # which kills the container on any platform that deploys this before the
        # order server exists. Connect on first use instead.
        initialized: ${MCP_CLIENT_INITIALIZED:false}
        request-timeout: 10s
        streamable-http:
          connections:
            order-server:
              url: ${MCP_ORDER_SERVER_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

app:
  # Endpoints under /api/conversations read and write conversation state without
  # calling the model. Set to false to leave them out of the application.
  testing-api:
    enabled: ${TESTING_API_ENABLED:true}
